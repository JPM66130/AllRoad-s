services:
  - type: web
    name: allroads-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port 8000
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: TESTER_ACCESS_TOKEN
        sync: false
      - key: OWNER_ACCESS_TOKEN
        sync: false
